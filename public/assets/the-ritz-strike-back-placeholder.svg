      <stop offset="0" stop-color="#14130f"/>
      <stop offset="0.5" stop-color="#080706"/>
      <stop offset="1" stop-color="#121b1b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="54%" cy="40%" r="54%">
      <stop offset="0" stop-color="#a43427" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#d79b4f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d79b4f" stop-opacity="0"/>
    </radialGradient>
