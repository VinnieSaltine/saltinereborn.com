name: Publish scheduled Saltine Reborn chapters

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without changing files, committing, or deploying"
        required: true
        default: true
        type: boolean
      now:
        description: "Optional test timestamp, for example 2026-07-18T12:00:00Z"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scheduled-chapter-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled publisher
        id: publish
        shell: bash
        run: |
          args=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=("--dry-run")
          fi

          if [[ -n "${{ inputs.now }}" ]]; then
            args+=("--now=${{ inputs.now }}")
          fi

          npm run publish:scheduled -- "${args[@]}"

      - name: Build site
        if: github.event_name == 'schedule' || inputs.dry_run != true
        run: npm run build

      - name: Commit published chapter
        if: github.event_name == 'schedule' || inputs.dry_run != true
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No scheduled chapter changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/chapters.ts src/pages/library.astro public/books/The-Saltine-Reborn
          git commit -m "Publish scheduled Saltine Reborn chapter"
          git push
